name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Signed export method (used only when signing secrets are configured)"
        type: choice
        default: ad-hoc
        options: [ad-hoc, development, app-store]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "Using simulator $UDID"
          xcodebuild test \
            -project Echo.xcodeproj \
            -scheme Echo \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Set build number
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/Echo.app dist/Payload/
          echo "Bundle contents:"; ls dist/Payload/Echo.app/PlugIns dist/Payload/Echo.app/Watch 2>&1
          (cd dist && zip -qry Echo-unsigned.ipa Payload)
          # Sideload build: free-account sideloaders rename the app's bundle ID
          # but not the embedded Watch app's companion ID, so iOS rejects the
          # install. This variant drops the Watch app; everything else is kept.
          rm -rf dist/Payload/Echo.app/Watch
          (cd dist && zip -qry Echo-sideload.ipa Payload && rm -rf Payload)
          ls -lh dist

      - name: Import signing certificate & profiles
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          PROFILE_WIDGETS: ${{ secrets.WIDGETS_PROVISION_PROFILE_BASE64 }}
          PROFILE_WATCH: ${{ secrets.WATCH_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || github.run_id }}
        run: |
          if [ -z "$PROFILE_WIDGETS" ] || [ -z "$PROFILE_WATCH" ]; then
            echo "::warning::Signed build skipped: Echo embeds a widget extension and a Watch app, so it needs three profiles (BUILD_, WIDGETS_ and WATCH_PROVISION_PROFILE_BASE64)."
            echo "HAS_SIGNING=false" >> $GITHUB_ENV
            exit 0
          fi
          CERT=$RUNNER_TEMP/cert.p12
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          install_profile() {  # $1 = base64 profile, $2 = env var prefix
            local file=$RUNNER_TEMP/$2.mobileprovision
            echo -n "$1" | base64 --decode -o "$file"
            security cms -D -i "$file" > $RUNNER_TEMP/$2.plist
            local uuid=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/$2.plist)
            cp "$file" ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision
            echo "$2=$uuid" >> $GITHUB_ENV
          }
          install_profile "$PROFILE_APP" ECHO_PROFILE_APP
          install_profile "$PROFILE_WIDGETS" ECHO_PROFILE_WIDGETS
          install_profile "$PROFILE_WATCH" ECHO_PROFILE_WATCH
          TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" $RUNNER_TEMP/ECHO_PROFILE_APP.plist)
          echo "TEAM_ID=$TEAM" >> $GITHUB_ENV

      - name: Archive & export signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
        run: |
          set -o pipefail
          # Each target picks its own profile via $(ECHO_PROFILE_*) in project.yml.
          xcodebuild archive \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/Echo.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            ECHO_PROFILE_APP="$ECHO_PROFILE_APP" \
            ECHO_PROFILE_WIDGETS="$ECHO_PROFILE_WIDGETS" \
            ECHO_PROFILE_WATCH="$ECHO_PROFILE_WATCH" \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.anticdrazelb.echo</key><string>${ECHO_PROFILE_APP}</string>
              <key>com.anticdrazelb.echo.widgets</key><string>${ECHO_PROFILE_WIDGETS}</string>
              <key>com.anticdrazelb.echo.watchkitapp</key><string>${ECHO_PROFILE_WATCH}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Echo.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export
          cp $RUNNER_TEMP/export/*.ipa dist/Echo.ipa
          ls -lh dist

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: Echo-${{ github.run_number }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
          generate_release_notes: true

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
