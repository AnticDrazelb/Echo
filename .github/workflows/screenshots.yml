name: Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Capture screens
        run: |
          mkdir -p shots
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Echo.app
          for scene in home editor editor-blend export newstyle blend dna; do
            xcrun simctl terminate "$UDID" com.anticdrazelb.echo 2>/dev/null || true
            xcrun simctl launch --stdout="$PWD/shots/$scene.log" --stderr="$PWD/shots/$scene.log" "$UDID" com.anticdrazelb.echo -EchoDemo "$scene"
            sleep 14
            xcrun simctl io "$UDID" screenshot "shots/$scene.png"
          done
          ls -lh shots
          tail -n 20 shots/*.log || true

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: shots/*
          if-no-files-found: error
