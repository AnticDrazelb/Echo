name: Echo
options:
  bundleIdPrefix: com.anticdrazelb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - path: Echo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anticdrazelb.echo
        PRODUCT_NAME: Echo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Echo/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  EchoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EchoTests
    dependencies:
      - target: Echo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anticdrazelb.echo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Echo.app/Echo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Echo:
    build:
      targets:
        Echo: all
        EchoTests: [test]
    test:
      targets:
        - EchoTests
      gatherCoverageData: false
